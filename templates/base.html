<!DOCTYPE html>
<html>
<head>
    <title>Shopping App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">🛒 Shopping App</span>

    <div>
        {% if session.get('user') %}
            <span class="text-white me-3">Hi, {{ session['user'] }}</span>

            {% if session.get('role') == 'admin' %}
                <a href="/admin" class="btn btn-warning btn-sm">Admin</a>
            {% endif %}

            <a href="/products" class="btn btn-info btn-sm">Products</a>
            <a href="/cart" class="btn btn-success btn-sm">Cart</a>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
