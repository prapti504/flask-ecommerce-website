{% extends 'base.html' %}
{% block content %}

<div class="col-md-4 mx-auto card p-4 shadow">
    <h3 class="text-center">Login</h3>

    <form action="/login_user" method="post">
        <input name="name" class="form-control mb-2" placeholder="Username">
        <input name="password" type="password" class="form-control mb-2" placeholder="Password">
        <button class="btn btn-primary w-100">Login</button>
    </form>

    <a href="/register" class="text-center mt-2 d-block">Register</a>
</div>

{% endblock %}
