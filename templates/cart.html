{% extends 'base.html' %}
{% block content %}

<h3>Your Cart</h3>

<table class="table table-bordered">
<tr>
    <th>Name</th>
    <th>Price</th>
</tr>

{% for item in items %}
<tr>
    <td>{{ item['name'] }}</td>
    <td>₹{{ item['price'] }}</td>
</tr>
{% endfor %}
</table>

<h4>Total: ₹{{ total }}</h4>

{% endblock %}
